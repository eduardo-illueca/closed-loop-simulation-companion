[project]
name = "closed_loop_sim"
version = "0.1.0"
description = "Ground-truth simulation study for the closed-loop causal-model-refinement framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pm4py>=2.7",
    "lifelines>=0.28",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["closed_loop_sim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["closed_loop_sim/tests"]
